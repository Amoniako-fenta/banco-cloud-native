spring.application.name=banco-cloud-sucursales

server.port=8082
server.address=0.0.0.0


# ===============================
# BASE DE DATOS
# ===============================

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/banco_cloud}
spring.datasource.username=${DB_USER:bancocloud}
spring.datasource.password=${DB_PASSWORD:BancoCloud123}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


# ===============================
# RABBITMQ
# ===============================

spring.rabbitmq.host=${RABBIT_HOST:localhost}
spring.rabbitmq.port=${RABBIT_PORT:5672}
spring.rabbitmq.username=${RABBIT_USER:admin}
spring.rabbitmq.password=${RABBIT_PASSWORD:admin123}

spring.rabbitmq.listener.simple.acknowledge-mode=manual
spring.rabbitmq.listener.simple.prefetch=1


# ===============================
# MENSAJERIA SUCURSALES
# ===============================

bancocloud.rabbit.sucursal.exchange=banco.sucursales.exchange

bancocloud.rabbit.sucursal.queue=banco.sucursales.creadas.queue

bancocloud.rabbit.sucursal.routing-key=banco.sucursales.creada

# Reintentos para errores recuperables antes de mandar el mensaje a la DLQ
bancocloud.rabbit.sucursal.max-retries=3


# ===============================
# DEAD LETTER
# ===============================

bancocloud.rabbit.sucursal.dlx=banco.sucursales.dlx

bancocloud.rabbit.sucursal.dlq=banco.sucursales.creadas.dlq

bancocloud.rabbit.sucursal.dlq-routing-key=banco.sucursales.error
