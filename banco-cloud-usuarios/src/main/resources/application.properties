# ===============================
# APLICACIÓN Y SERVIDOR
# ===============================
spring.application.name=banco-cloud-usuarios

server.port=8081
server.address=0.0.0.0

# ===============================
# BASE DE DATOS
# ===============================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/banco_cloud}
spring.datasource.username=${DB_USER:bancocloud}
spring.datasource.password=${DB_PASSWORD:BancoCloud123}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# KEYCLOAK / OAUTH2
# ===============================
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/bancocloud}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_URI:http://localhost:8080/realms/bancocloud/protocol/openid-connect/certs}

# ===============================
# RABBITMQ
# ===============================
spring.rabbitmq.host=${RABBIT_HOST:localhost}
spring.rabbitmq.port=${RABBIT_PORT:5672}
spring.rabbitmq.username=${RABBIT_USER:admin}
spring.rabbitmq.password=${RABBIT_PASSWORD:admin123}

spring.rabbitmq.listener.simple.acknowledge-mode=manual
spring.rabbitmq.listener.simple.prefetch=1

# ===============================
# MENSAJERIA USUARIOS
# ===============================
bancocloud.rabbit.usuario.exchange=banco.usuarios.exchange
bancocloud.rabbit.usuario.queue=banco.usuarios.eventos.queue
bancocloud.rabbit.usuario.routing-key=banco.usuarios.evento

# Reintentos antes de enviar a DLQ
bancocloud.rabbit.usuario.max-retries=3

# ===============================
# DEAD LETTER
# ===============================
bancocloud.rabbit.usuario.dlx=banco.usuarios.dlx
bancocloud.rabbit.usuario.dlq=banco.usuarios.eventos.dlq
bancocloud.rabbit.usuario.dlq-routing-key=banco.usuarios.error