spring.application.name=banco-cloud-cajeros

server.port=8083
server.address=0.0.0.0


# ===============================
# BASE DE DATOS
# ===============================

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/banco_cloud}
spring.datasource.username=${DB_USER:bancocloud}
spring.datasource.password=${DB_PASSWORD:BancoCloud123}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


# ===============================
# RABBITMQ
# ===============================

spring.rabbitmq.host=${RABBIT_HOST:localhost}
spring.rabbitmq.port=${RABBIT_PORT:5672}
spring.rabbitmq.username=${RABBIT_USER:admin}
spring.rabbitmq.password=${RABBIT_PASSWORD:admin123}

spring.rabbitmq.listener.simple.acknowledge-mode=manual
spring.rabbitmq.listener.simple.prefetch=1


# ===============================
# MENSAJERIA CAJEROS
# ===============================

bancocloud.rabbit.cajero.exchange=banco.cajeros.exchange

bancocloud.rabbit.cajero.queue=banco.cajeros.creados.queue

bancocloud.rabbit.cajero.routing-key=banco.cajeros.creado

# Reintentos para errores recuperables antes de mandar el mensaje a la DLQ
bancocloud.rabbit.cajero.max-retries=3


# ===============================
# DEAD LETTER
# ===============================

bancocloud.rabbit.cajero.dlx=banco.cajeros.dlx

bancocloud.rabbit.cajero.dlq=banco.cajeros.creados.dlq

bancocloud.rabbit.cajero.dlq-routing-key=banco.cajeros.error
