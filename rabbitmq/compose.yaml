services:

  rabbitmq:
    image: rabbitmq:4-management
    container_name: banco-cloud-rabbitmq

    ports:
      - "5672:5672"
      - "15672:15672"

    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin123

    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

    restart: unless-stopped

volumes:
  rabbitmq-data: