spring.application.name=banco-cloud-bff

server.port=8084
server.address=0.0.0.0


# ===============================
# SEGURIDAD (Keycloak como IDaaS)
# ===============================

# Issuer del realm. Spring descarga la clave publica (JWKS) desde aqui para validar la firma.
# En AWS debe ser la URL publica con HTTPS de Keycloak.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER:http://localhost:8180/realms/banco-cloud}

# Valor esperado en el claim "aud" (se agrega con un Audience Mapper en el cliente banco-cloud-frontend)
bancocloud.security.audience=${KEYCLOAK_AUDIENCE:account}

# Origenes permitidos (frontend). En AWS: URL de CloudFront, separadas por coma
bancocloud.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}


# ===============================
# MICROSERVICIOS INTERNOS
# ===============================

bancocloud.usuarios.url=${USUARIOS_SERVICE_URL:http://localhost:8081}
bancocloud.sucursales.url=${SUCURSALES_SERVICE_URL:http://localhost:8082}
bancocloud.cajeros.url=${CAJEROS_SERVICE_URL:http://localhost:8083}


# ===============================
# ACTUATOR
# ===============================

management.endpoints.web.exposure.include=health
